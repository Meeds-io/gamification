gamification.defaultProgram.rule.addSpace.title=Iniciar sua própria comunidade
gamification.defaultProgram.rule.addSpace.description=Crie um espaço que tenha como objetivo lidar com um tópico, ou que hospede sua própria comunidade

gamification.defaultProgram.rule.pinActivityOnSpace.title=Fixar mensagens importantes
gamification.defaultProgram.rule.pinActivityOnSpace.description=Num espaço que administra, afixe as atividades que considera que os seus membros precisam de ver ao navegar no espaço da sua comunidade

gamification.defaultProgram.rule.inviteUserToSpace.title=Convide pessoas para aderirem a um espaço
gamification.defaultProgram.rule.inviteUserToSpace.description=Como administrador do espaço, convide pessoas para aderirem, consoante o tema e a respetiva especialidade.

gamification.defaultProgram.rule.becomeSpaceManager.title=Gerir o seu próprio espaço
gamification.defaultProgram.rule.becomeSpaceManager.description=Torne-se administrador de um espaço e incentive a sua comunidade a partilhar conhecimento, a colaborar ou a participar em projetos

gamification.defaultProgram.rule.addUserProfileAvatar.title=Adicionar um avatar de perfil
gamification.defaultProgram.rule.addUserProfileAvatar.description=Defina um avatar de perfil para que outros membros possam reconhecê-lo facilmente


gamification.defaultProgram.rule.addUserProfileBanner.title=Adicionar um banner de perfil
gamification.defaultProgram.rule.addUserProfileBanner.description=Torne o seu perfil mais apelativo ao adicionar uma faixa personalizada


gamification.defaultProgram.rule.addUserProfileAboutMe.title=Apresente-se
gamification.defaultProgram.rule.addUserProfileAboutMe.description=Preencha a secção "Sobre mim" no seu perfil.<br>É a primeira coisa que os outros verão quando visitarem o seu perfil.

gamification.defaultProgram.rule.addUserProfileContactInformation.title=Introduza as suas informações de contacto
gamification.defaultProgram.rule.addUserProfileContactInformation.description=No seu perfil, introduza as suas informações de contacto para que outros membros o possam contactar, se necessário.


gamification.defaultProgram.rule.addUserProfileWorkExperience.title=Partilhe a sua experiência no perfil
gamification.defaultProgram.rule.addUserProfileWorkExperience.description=Qualquer experiência profissional, ou outra, pode ser útil para qualquer pessoa.<br>Por isso, conte à sua comunidade o que fez e quais são as suas competências reconhecidas

gamification.defaultProgram.rule.addUserProfileNotificationSetting.title=Defina suas preferências de notificações
gamification.defaultProgram.rule.addUserProfileNotificationSetting.description=Aceda às suas definições de notificações a partir do centro de notificações.<br>Aí, recomendamos que reveja as preferências de notificações para as definir de acordo com a sua conveniência.

gamification.defaultProgram.rule.joinSpace.title=Junte-se a outras comunidades
gamification.defaultProgram.rule.joinSpace.description=Descubra outras comunidades ao aderir a elas e comece a contribuir

gamification.defaultProgram.rule.updateSpaceAvatar.title=Avatar do Espaço Personalizado
gamification.defaultProgram.rule.updateSpaceAvatar.description=Aceda às definições do espaço e altere o logótipo do seu espaço

