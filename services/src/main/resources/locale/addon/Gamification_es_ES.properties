gamification.defaultProgram.rule.addSpace.description=Cree un espacio que tenga como objetivo abordar un tema, o que sea el anfitrión de su propia comunidad

gamification.defaultProgram.rule.pinActivityOnSpace.title=Anclar mensajes importantes
gamification.defaultProgram.rule.pinActivityOnSpace.description=En un espacio que aloja, ancle las actividades que crea que sus miembros necesitan ver cuando navegan por su espacio comunitario

gamification.defaultProgram.rule.inviteUserToSpace.title=Invitar a gente a unirse a un espacio
gamification.defaultProgram.rule.inviteUserToSpace.description=Como anfitrión del espacio, invite a la gente a unirse a su comunidad dependiendo del tema y su pericia. Así, podrá hacer que su comunidad se involucre y sea poderosa

gamification.defaultProgram.rule.becomeSpaceManager.title=Administrar su propio espacio
gamification.defaultProgram.rule.becomeSpaceManager.description=Conviértase en anfitrión y anime a su comunidad a compartir conocimientos, a trabajar en equipo, a participar en un proyecto

gamification.defaultProgram.rule.addUserProfileAvatar.title=Añadir un avatar de perfil
gamification.defaultProgram.rule.addUserProfileAvatar.description=Establecer un avatar de perfil para que otros miembros puedan reconocerte fácilmente


gamification.defaultProgram.rule.addUserProfileBanner.title=Añadir un banner de perfil
gamification.defaultProgram.rule.addUserProfileBanner.description=Haga su perfil más atractivo añadiendo un banner personalizado


gamification.defaultProgram.rule.addUserProfileAboutMe.title=Preséntate
gamification.defaultProgram.rule.addUserProfileAboutMe.description=Rellene la sección "Acerca de mí" en su perfil.<br>Es lo primero que otros verán cuando visiten su perfil.

gamification.defaultProgram.rule.addUserProfileContactInformation.title=Introduzca su información de contacto
gamification.defaultProgram.rule.addUserProfileContactInformation.description=Desde su perfil, introduzca su información de contacto para que otros miembros puedan ponerse en contacto con usted si es necesario.


gamification.defaultProgram.rule.addUserProfileWorkExperience.title=Comparta su experiencia de perfil
gamification.defaultProgram.rule.addUserProfileWorkExperience.description=Cualquier experiencia laboral y cualquier otra experiencia puede ser útil para cualquiera.<br>Así que diga a su comunidad lo que ha hecho y cuáles son sus habilidades reconocidas

gamification.defaultProgram.rule.addUserProfileNotificationSetting.title=Configure sus preferencias de notificaciones
gamification.defaultProgram.rule.addUserProfileNotificationSetting.description=Acceda a su configuración de notificaciones desde su centro de notificaciones.<br>Una vez allí, le recomendamos revisar las preferencias de notificaciones para que pueda configurarlas a su conveniencia.

gamification.defaultProgram.rule.joinSpace.title=Únase a otras comunidades
gamification.defaultProgram.rule.joinSpace.description=Descubra otras comunidades uniéndose a ellas y empiece a contribuir allí

gamification.defaultProgram.rule.updateSpaceAvatar.title=Avatar espacio personalizado
gamification.defaultProgram.rule.updateSpaceAvatar.description=Acceda a la configuración del espacio y cambie el avatar de su espacio

