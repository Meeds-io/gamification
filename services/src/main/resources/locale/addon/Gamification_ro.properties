gamification.defaultProgram.CommunityEmpowerment.description.secondInstruction=Fii activ pe platformă felicitându-i pe ceilalți membri
gamification.defaultProgram.CommunityEmpowerment.description.thirdInstruction=Începeți să vă creați propriul spațiu și ajutați comunitatea să împărtășească cunoștințe
gamification.defaultProgram.label.seeDocumentation=Contactați serviciile de asistență, dacă este necesar

gamification.defaultProgram.rule.sendRelationshipRequest.title=Solicitare rețea
gamification.defaultProgram.rule.sendRelationshipRequest.description=Din pagina Persoane, cereți celorlalți să se alăture rețelei dvs.<br>De aici, le veți găsi cu ușurință când veți căuta în directorul de persoane

gamification.defaultProgram.rule.receiveRelationshipRequest.title=Conexiune la rețea
gamification.defaultProgram.rule.receiveRelationshipRequest.description=Faceți-vă cunoscute abilitățile și expertiza.<br>Atrageți mai multe persoane să se conecteze cu dvs.

gamification.defaultProgram.rule.addSpace.title=Începe propria comunitate
gamification.defaultProgram.rule.addSpace.description=Creați un spațiu care vizează să se ocupe de un subiect sau care vă va găzdui propria comunitate

gamification.defaultProgram.rule.pinActivityOnSpace.title=Fixați mesajele importante
gamification.defaultProgram.rule.pinActivityOnSpace.description=Într-un spațiu pe care îl administrați, fixați activitățile pe care considerați că membrii trebuie să le vadă atunci când navighează în spațiul comunității

gamification.defaultProgram.rule.inviteUserToSpace.title=Invitați persoane să se alăture unui spațiu
gamification.defaultProgram.rule.inviteUserToSpace.description=În calitate de administrator al spațiului, invitați persoane să se alăture în funcție de subiect și de expertiza lor.

gamification.defaultProgram.rule.becomeSpaceManager.title=Gestionați-vă propriul spațiu
gamification.defaultProgram.rule.becomeSpaceManager.description=Deveniți o gazdă spațială și încurajați-vă comunitatea să vă împărtășească cunoștințe, să lucrați în echipă, să vă angajați într-un proiect

gamification.defaultProgram.rule.addUserProfileAvatar.title=Adăugați o fotografie de profil
gamification.defaultProgram.rule.addUserProfileAvatar.description=Setați un avatar de profil astfel încât alți membri să vă poată recunoaște cu ușurință


gamification.defaultProgram.rule.addUserProfileBanner.title=Adăugați un banner de profil
gamification.defaultProgram.rule.addUserProfileBanner.description=Faceți profilul mai atrăgător prin adăugarea unui banner personalizat


gamification.defaultProgram.rule.addUserProfileAboutMe.title=Introduce singur
gamification.defaultProgram.rule.addUserProfileAboutMe.description=Completați secțiunea "Despre mine" din profilul dvs.<br>este primul lucru pe care alții îl vor vedea când vă vizitează profilul.

gamification.defaultProgram.rule.addUserProfileContactInformation.title=Introduceți informațiile dvs. de contact
gamification.defaultProgram.rule.addUserProfileContactInformation.description=Din profilul dvs., introduceți informațiile de contact, astfel încât alți membri să vă poată contacta, dacă este necesar.


gamification.defaultProgram.rule.addUserProfileWorkExperience.title=Împărtășiți-vă experiența de profil
gamification.defaultProgram.rule.addUserProfileWorkExperience.description=Orice experiență profesională, ca și orice altă experiență, poate fi utilă oricui.<br>Așadar, spuneți comunității dvs. ce ați făcut și care sunt abilitățile dvs. recunoscute

gamification.defaultProgram.rule.addUserProfileNotificationSetting.title=Setați preferințele pentru notificări
gamification.defaultProgram.rule.addUserProfileNotificationSetting.description=Accesați setările de notificare din centrul de notificări.<br>Acolo, vă recomandăm să examinați preferințele de notificare, astfel încât să le setați după cum vă convine.

gamification.defaultProgram.rule.joinSpace.title=Alăturați-vă altor comunități
gamification.defaultProgram.rule.joinSpace.description=Descoperă alte comunități prin alăturarea lor și începe să contribuie acolo

gamification.defaultProgram.rule.updateSpaceAvatar.title=Avatar Spațiu personalizat
gamification.defaultProgram.rule.updateSpaceAvatar.description=Accesați setările spațiului și schimbați logoul spațiului dvs.

